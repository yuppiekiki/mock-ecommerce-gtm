    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .cart-container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            text-align: right;
            font-size: 24px;
            font-weight: bold;
            margin-top: 30px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

<header>
    <h1>Yuppie Store</h1>
    <a href="index.html">← Continue Shopping</a>
</header>

<div class="cart-container">

    <h2>Your Cart</h2>

    <div class="cart-item">
        <div>
            <strong>Wireless Headphones</strong>
            <p>Quantity: 1</p>
        </div>

        <div>$99</div>
    </div>

    <div class="total">
        Total: $99
    </div>

    <button onclick="beginCheckout()">
        Checkout
    </button>

</div>

<script>

function beginCheckout() {

    window.dataLayer = window.dataLayer || [];

    window.dataLayer.push({
        event: "begin_checkout",
        ecommerce: {
            currency: "AUD",
            value: 99,
            items: [
                {
                    item_name: "Wireless Headphones",
                    price: 99,
                    quantity: 1
                }
            ]
        }
    });

    alert("Checkout started!");
}

</script>
