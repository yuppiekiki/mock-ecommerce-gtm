<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-T77HBJWQ');</script>
<!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuppie Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .cart {
            font-size: 18px;
        }

        .hero {
            background: white;
            text-align: center;
            padding: 50px 20px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .products {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 0 20px;
        }

        .product {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
        }

        .product-image {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #222;
            color: white;
            margin-top: 50px;
        }

        @media (max-width: 700px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T77HBJWQ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<header>
    <h1>Yuppie Store</h1>

    <div class="cart">
        🛒 Cart: <span id="cart-count">0</span>
    </div>
</header>

<section class="hero">
    <h2>Welcome to Yuppie Store</h2>
    <p>Everything you need, all in one place.</p>
</section>

<section class="products">

    <div class="product">
        <div class="product-image">🎧</div>
        <h3>Wireless Headphones</h3>
        <p>Premium wireless headphones.</p>
        <div class="price">$99</div>

        <button onclick="addToCart('Wireless Headphones', 99)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <div class="product-image">👟</div>
        <h3>Running Shoes</h3>
        <p>Comfortable shoes for everyday running.</p>
        <div class="price">$129</div>

        <button onclick="addToCart('Running Shoes', 129)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <div class="product-image">⌚</div>
        <h3>Smart Watch</h3>
        <p>Track your activity and stay connected.</p>
        <div class="price">$159</div>

        <button onclick="addToCart('Smart Watch', 159)">
            Add to Cart
        </button>
    </div>

</section>

<footer>
    <p>© 2026 Yuppie Store</p>
</footer>

<script>

    let cartCount = 0;

function addToCart(productName, price) {

    cartCount = cartCount + 1;

    document.getElementById("cart-count").textContent = cartCount;

    window.dataLayer = window.dataLayer || [];

    window.dataLayer.push({
        event: "add_to_cart",
        ecommerce: {
            currency: "AUD",
            value: price,
            items: [
                {
                    item_name: productName,
                    price: price,
                    quantity: 1
                }
            ]
        }
    });

    alert(productName + " added to cart!");
}

</script>

</body>
</html>
